<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111c35">
<meta name="description" content="부산의 밤바다에서 시작하는 네 조각의 작은 모험.">
<title>부산에서 생긴일. 프로포즈편</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23111c35' d='M0 0h16v16H0z'/%3E%3Cpath fill='%23ffd36b' d='M3 3h4V1h3v2h3v4h2v3h-2v3H9v2H6v-2H3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="content.js" defer></script>
<script src="game.js" defer></script>
</head>
<body>
<main id="game" aria-label="부산에서 생긴일 게임">
  <header><div id="progress" aria-live="polite"></div><div class="tools"><button id="mute"></button><button id="reset"></button></div></header>
  <div class="stagebar"><span id="stageName"></span><span id="subStatus"></span></div>
  <section id="viewport">
    <canvas id="scene" width="320" height="240" aria-label="픽셀 게임 장면"></canvas>
    <div id="overlay"></div>
    <div id="toast" role="status"></div>
  </section>
  <section id="dialog" aria-live="polite"><span id="speaker"></span><p id="message"></p><button id="next" aria-label="다음 대화">▼</button></section>
  <section id="controls" aria-label="게임 조작">
    <div class="dpad"><button id="up" data-dir="up" aria-label="위 / 점프">▲</button><button id="left" data-dir="left" aria-label="왼쪽">◀</button><button id="down" data-dir="down" aria-label="아래">▼</button><button id="right" data-dir="right" aria-label="오른쪽">▶</button></div>
    <div class="action"><span id="actionHint"></span><button id="action" aria-label="A 상호작용">A</button></div>
  </section>
  <footer id="help"></footer>
</main>
</body>
</html>
